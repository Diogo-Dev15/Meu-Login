<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <div class="card">
            <h1 class="title">CREATE ACCOUNT</h1>
            <p class="subtitle">Or Login with...</p>

            <!-- Ícones Sociais usando suas imagens -->
            <div class="social-icons">
                <a href="#" class="social-btn" aria-label="Login with Google">
                    <img src="img/image 1.png" alt="Google">
                </a>

                <a href="#" class="social-btn" aria-label="Login with Facebook">
                    <img src="img/image 4.png" alt="Facebook">
                </a>

                <a href="#" class="social-btn" aria-label="Login with LinkedIn">
                    <img src="img/image 3.png" alt="LinkedIn">
                </a>
            </div>

            <!-- Formulário -->
            <form class="form" action="#" method="POST">
                <div class="input-group">
                    <input type="text" placeholder="Name..." required>
                </div>

                <div class="input-group">
                    <input type="email" placeholder="E-mail" required>
                </div>

                <div class="input-group">
                    <input type="tel" placeholder="Phone Number" required>
                </div>

                <!-- Botões inferiores -->
                <div class="actions">
                    <button type="submit" class="btn-primary">
                        <span>Sign In</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>

                    <a href="#" class="btn-secondary">Sign Up</a>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
